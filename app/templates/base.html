<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Análisis Operativo - Servicio al Cliente{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        header {
            background: #1e293b;
            padding: 1rem 0;
            border-bottom: 2px solid #334155;
            margin-bottom: 2rem;
        }
        header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        nav {
            background: #1e293b;
            padding: 0.75rem 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 1.5rem;
        }
        nav a {
            color: #38bdf8;
            text-decoration: none;
            margin-right: 1.5rem;
            font-weight: 500;
        }
        nav a:hover {
            color: #7dd3fc;
        }
        main {
            background: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #7dd3fc;
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        .alert-info {
            background: #1e3a5f;
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }
        .alert-warning {
            background: #5f2a1a;
            border: 1px solid #f87171;
            color: #f87171;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: #0f172a;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #1e293b;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover {
            background: #334155;
        }
        .contadores {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .contador {
            flex: 1;
            min-width: 180px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }
        .contador h3 {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .contador .valor {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .filtro {
            margin-bottom: 1rem;
        }
        .filtro input {
            padding: 0.5rem;
            width: 100%;
            max-width: 300px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 4px;
        }
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-info { background: #1e3a5f; color: #38bdf8; }
        .badge-warning { background: #5f1a1a; color: #f87171; }
        footer {
            margin-top: 2rem;
            padding: 1rem;
            color: #64748b;
            font-size: 0.85rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📊 Análisis Operativo - Servicio al Cliente</h1>
            <p>Contact Center Bancario - Informe Ejecutivo Mensual</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <a href="/">Inicio</a>
            <a href="/resultados">Resultados</a>
            <a href="/detalle">Detalle</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="container">
            <p>App de Análisis Operativo - Contact Center Bancario &copy; 2026</p>
        </div>
    </footer>
</body>
</html>
